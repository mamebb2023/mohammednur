    <!-- Kulim Park lives here rather than in a CSS @import: an @import makes the
         browser discover the font only after the stylesheet lands, which stalls the
         first paint behind a third-party round trip. Loaded non-render-blocking, so a
         slow or unreachable Google Fonts can't hold the first paint hostage either.
         The extra families are only used by the /projects/* hero explorations;
         browsers fetch those files only when such a page renders text that needs them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Engagement&family=Inter:wght@300;400;500;600&family=Kulim+Park:wght@400;500&family=Montserrat:wght@200;300;400;500&family=Playfair+Display:wght@300;400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Engagement&family=Inter:wght@300;400;500;600&family=Kulim+Park:wght@400;500&family=Montserrat:wght@200;300;400;500&family=Playfair+Display:wght@300;400;500;600&display=swap"
      />
    </noscript>
